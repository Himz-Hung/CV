<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV / Portfolio của Đặng Ngọc Hưng — Front-end Developer chuyên ReactJS & TypeScript." />
    <title>Đặng Ngọc Hưng — Front-end Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <svg class="boot-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="Himz">
        <defs>
          <linearGradient id="bootGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#818cf8" />
            <stop offset="0.5" stop-color="#e879f9" />
            <stop offset="1" stop-color="#fdba74" />
          </linearGradient>
          <clipPath id="bootClip">
            <path d="M10 8 H17 V20 H31 V8 H38 V40 H31 V27 H17 V40 H10 Z" />
          </clipPath>
        </defs>
        <g transform="translate(6 0) skewX(-12)">
          <g clip-path="url(#bootClip)">
            <rect x="6" y="6" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="12" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="18" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="24" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="30" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="36" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="42" width="36" height="3.6" fill="url(#bootGrad)" />
          </g>
        </g>
      </svg>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        background: #05050a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .boot-logo {
        width: 88px;
        height: 88px;
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%, 100% { opacity: 0.4; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
