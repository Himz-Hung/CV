<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV / Portfolio của Đặng Ngọc Hưng — Front-end Developer chuyên ReactJS & TypeScript." />
    <title>Đặng Ngọc Hưng — Front-end Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <svg class="boot-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="Himz">
        <defs>
          <linearGradient id="bootGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#818cf8" />
            <stop offset="0.5" stop-color="#e879f9" />
            <stop offset="1" stop-color="#fdba74" />
          </linearGradient>
        </defs>
        <rect x="1.25" y="1.25" width="45.5" height="45.5" rx="13.5" fill="rgba(255,255,255,0.045)" stroke="url(#bootGrad)" stroke-width="1.5" />
        <g fill="url(#bootGrad)">
          <rect x="14" y="13" width="5" height="22" rx="2.5" />
          <rect x="29" y="13" width="5" height="22" rx="2.5" />
          <rect x="15.5" y="21.5" width="17" height="5" rx="2.5" />
        </g>
        <circle cx="37.5" cy="11" r="2.1" fill="#fdba74" />
      </svg>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        background: #05050a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .boot-logo {
        width: 88px;
        height: 88px;
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%, 100% { opacity: 0.4; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
