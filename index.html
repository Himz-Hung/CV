<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV / Portfolio của Đặng Ngọc Hưng (Dang Ngoc Hung) — Front-end Developer chuyên ReactJS & TypeScript." />
    <meta name="author" content="Dang Ngoc Hung" />
    <meta name="theme-color" content="#05050a" />
    <title>Đặng Ngọc Hưng — Front-end Developer</title>

    <!-- TODO: đổi https://your-domain.com thành domain thật và thêm ảnh public/og-image.png (1200×630) -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Open Graph (Facebook, Zalo, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dang Ngoc Hung — Portfolio" />
    <meta property="og:title" content="Đặng Ngọc Hưng — Front-end Developer" />
    <meta property="og:description" content="CV / Portfolio — Front-end Developer chuyên ReactJS & TypeScript, UI Engineering." />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Đặng Ngọc Hưng — Front-end Developer" />
    <meta name="twitter:description" content="CV / Portfolio — Front-end Developer chuyên ReactJS & TypeScript." />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <!-- Structured data: giúp Google hiểu đây là hồ sơ cá nhân -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Dang Ngoc Hung",
        "alternateName": "Đặng Ngọc Hưng",
        "jobTitle": "Front-end Developer",
        "email": "mailto:hungitforwork@gmail.com",
        "url": "https://your-domain.com/",
        "sameAs": ["https://github.com/Himz-Hung"],
        "knowsAbout": ["ReactJS", "TypeScript", "Redux", "TailwindCSS", "UI Engineering"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ho Chi Minh City",
          "addressCountry": "VN"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <svg class="boot-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="Himz">
        <defs>
          <linearGradient id="bootGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#818cf8" />
            <stop offset="0.5" stop-color="#e879f9" />
            <stop offset="1" stop-color="#fdba74" />
          </linearGradient>
          <clipPath id="bootClip">
            <path d="M10 8 H17 V20 H31 V8 H38 V40 H31 V27 H17 V40 H10 Z" />
          </clipPath>
        </defs>
        <g transform="translate(6 0) skewX(-12)">
          <g clip-path="url(#bootClip)">
            <rect x="6" y="6" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="12" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="18" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="24" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="30" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="36" width="36" height="3.6" fill="url(#bootGrad)" />
            <rect x="6" y="42" width="36" height="3.6" fill="url(#bootGrad)" />
          </g>
        </g>
      </svg>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        background: #05050a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .boot-logo {
        width: 88px;
        height: 88px;
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%, 100% { opacity: 0.4; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
